name: Node.js CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 22
            pnpm-version: 11
          - node-version: 24
            pnpm-version: latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up pnpm and Node.js ${{ matrix.node-version }}
        uses: pnpm/setup@v2
        with:
          version: ${{ matrix.pnpm-version }}
          runtime: node@${{ matrix.node-version }}
          cache: true
          require-lockfile: true

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm fmt:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
