name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Create or update release pull request
        id: release-pr
        uses: changesets/action/version@v2
        with:
          script: pnpm run version
          commit-message: "chore(release): publish new version"
          pr-title: "Release verdaccio-openid"

      # The pull request body is rendered from CHANGELOG.md, which is English
      # only. Add the Chinese section there too, inside markers a re-run replaces.
      - name: Add the Chinese section to the pull request
        if: steps.release-pr.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-notes.mjs pr ${{ steps.release-pr.outputs.pr-number }}

  publish:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish with npm trusted publishing
        uses: changesets/action/publish@v2
        with:
          script: pnpm changeset publish
          # The release is created below, with the Chinese section in its notes.
          create-github-releases: false

      # Runs even when this run published nothing: a run that published but failed
      # before creating the release is repaired by the next one. The script skips
      # an existing release and a tag that never got pushed.
      - name: Create the release with bilingual notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-notes.mjs release
